spring:
  application:
    name: scheduler
  datasource:
    url: jdbc:postgresql://localhost:5432/scheduler
    username: scheduler
    password: scheduler
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

holiday:
  nager:
    base-url: https://date.nager.at
    connect-timeout: 2s
    read-timeout: 3s
  cache:
    ttl-days: 30
    retry-backoff: 15m

logging:
  level:
    com.holidayaware.scheduler: INFO
